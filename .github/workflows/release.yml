# Builds EOF, uploads it to TestFlight, sends it to the external group and creates a GitHub release.
#
# Run it by pushing a tag `v<marketing version>-<build number>`, e.g. `git tag v1.0.0-26 && git push origin v1.0.0-26`.
# The marketing version must match MARKETING_VERSION in project.yml. What to Test and the release notes
# come from Release/notes.json (en-US and zh-Hans) at the tagged commit.
#
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key, Admin role, so Xcode can
# use cloud-managed signing). Optional: DIST_CERT_P12 (base64) and DIST_CERT_PASSWORD to sign with a
# local Apple Distribution certificate instead.
name: Release

on:
  push:
    tags: ['v*-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.0.0-26'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      APP_ID: '6835582955'
      BETA_GROUP: 'Public Beta'
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)-([0-9]+)$ ]]; then
            echo "::error::Tag $tag is not v<version>-<build>"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "build=${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Check version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          declared=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml | head -1)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::Tag version $VERSION does not match MARKETING_VERSION $declared in project.yml"; exit 1
          fi
          xcodebuild -version

      - name: Write the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Import the distribution certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        if: env.DIST_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD: ${{ steps.tag.outputs.build }}
        run: |
          xcodebuild archive \
            -project EOF.xcodeproj -scheme EOF -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EOF.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E 'error:' "$RUNNER_TEMP/archive.log" | head -50; tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/archive.log"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>433DLLA855</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EOF.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Send to TestFlight testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ steps.tag.outputs.version }}
          BUILD: ${{ steps.tag.outputs.build }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'pyjwt[crypto]==2.10.1'
          "$RUNNER_TEMP/venv/bin/python" Tools/testflight.py \
            --key "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" --app "$APP_ID" \
            --version "$VERSION" --build "$BUILD" --group "$BETA_GROUP" --notes Release/notes.json

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          BUILD: ${{ steps.tag.outputs.build }}
        run: |
          previous=$(git tag --list 'v*-*' --sort=-creatordate | grep -vx "$TAG" | head -1 || true)
          {
            python3 -c 'import json; n = json.load(open("Release/notes.json")); print(n["en-US"]); print(); print(n["zh-Hans"])'
            echo
            echo "TestFlight: https://testflight.apple.com/join/uJPkDruK"
            if [ -n "$previous" ]; then
              echo
              echo "## Changes since $previous"
              git log --no-merges --format='- %s (%h)' "$previous..$TAG"
            fi
          } > "$RUNNER_TEMP/release.md"
          gh release create "$TAG" --title "EOF $VERSION ($BUILD)" --notes-file "$RUNNER_TEMP/release.md" --verify-tag

      - name: Remove the signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi

<!doctype html>
<meta name="viewport" content="width=device-width">
<style>
  :root { color-scheme: light dark; font: 13px system-ui, sans-serif; }
  body { margin: 0; height: 100vh; display: grid; place-content: center; gap: 10px; }
  canvas { width: min(78vw, 70vh); image-rendering: pixelated; touch-action: none;
           border-radius: 12px; background: #16181D; cursor: crosshair; }
  p { margin: 0; text-align: center; opacity: .6; }
</style>
<canvas id="board" width="48" height="48"></canvas>
<p>Draw on the board · generation <b id="gen">0</b></p>
<script>
  const N = 48, ctx = board.getContext('2d');
  const colour = [null, '#E873B8', '#7FB4FF', '#64D2C8'];
  let age = new Uint8Array(N * N).map(() => Math.random() < 0.2 ? 1 : 0);
  let ticks = 0;

  function step() {
    const next = new Uint8Array(N * N);
    for (let i = 0; i < N * N; i++) {
      const x = i % N, y = Math.floor(i / N);
      let n = 0;
      for (let dy = -1; dy <= 1; dy++)
        for (let dx = -1; dx <= 1; dx++)
          if (dx || dy) n += age[(y + dy + N) % N * N + (x + dx + N) % N] > 0;
      next[i] = n === 3 || (age[i] && n === 2) ? Math.min(age[i] + 1, 3) : 0;
    }
    age = next;
    gen.textContent = ++ticks;
  }

  function draw() {
    ctx.clearRect(0, 0, N, N);
    age.forEach((a, i) => {
      if (a) { ctx.fillStyle = colour[a]; ctx.fillRect(i % N, Math.floor(i / N), 1, 1); }
    });
  }

  board.onpointerdown = board.onpointermove = (e) => {
    if (e.type === 'pointermove' && !e.buttons) return;
    const r = board.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / r.width * N);
    const y = Math.floor((e.clientY - r.top) / r.height * N);
    age[y * N + x] = 1;
    draw();
  };

  setInterval(() => { step(); draw(); }, 120);
</script>

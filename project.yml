name: EOF
options:
  bundleIdPrefix: moe.luoling
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: 433DLLA855
packages:
  EOFCore:
    path: EOFCore
  # TreeSitterLanguages has no release with the newer grammars (XML, Objective-C, Diff, Dart, Scala…), and its
  # main branch pins Runestone to one revision. Both are pinned by revision so they always resolve together.
  Runestone:
    url: https://github.com/simonbs/Runestone
    revision: 00426ba7f8681a90c1ea0b5c03a0e0bec8cba883
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages
    revision: 4442182303a00bf2764b10ead923a1066a0946f6
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
  # Grammars that TreeSitterLanguages does not carry. Each is a plain C target; their highlight
  # queries are copied into App/Resources/Queries so the app does not depend on bundle names.
  TreeSitterKotlin:
    url: https://github.com/fwcd/tree-sitter-kotlin
    revision: d6af96d2e23ef0a8ff5ab512864378cf08fba311
  TreeSitterDockerfile:
    url: https://github.com/camdencheek/tree-sitter-dockerfile
    revision: 971acdd908568b4531b0ba28a445bf0bb720aba5
  TreeSitterIni:
    url: https://github.com/justinmk/tree-sitter-ini
    revision: e4018b5176132b4f3c5d6e61cea383f42288d0f5
targets:
  EOF:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: EOFCore
      - package: Runestone
      - package: ZIPFoundation
      - package: TreeSitterKotlin
      - package: TreeSitterDockerfile
      - package: TreeSitterIni
      - package: TreeSitterLanguages
        product: TreeSitterSwiftRunestone
      - package: TreeSitterLanguages
        product: TreeSitterObjectiveCRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCPPRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCSharpRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJavaRunestone
      - package: TreeSitterLanguages
        product: TreeSitterGoRunestone
      - package: TreeSitterLanguages
        product: TreeSitterRustRunestone
      - package: TreeSitterLanguages
        product: TreeSitterPythonRunestone
      - package: TreeSitterLanguages
        product: TreeSitterRubyRunestone
      - package: TreeSitterLanguages
        product: TreeSitterPHPRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJavaScriptRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTypeScriptRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTSXRunestone
      - package: TreeSitterLanguages
        product: TreeSitterHTMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterSvelteRunestone
      - package: TreeSitterLanguages
        product: TreeSitterAstroRunestone
      - package: TreeSitterLanguages
        product: TreeSitterXMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCSSRunestone
      - package: TreeSitterLanguages
        product: TreeSitterSCSSRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJSONRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJSON5Runestone
      - package: TreeSitterLanguages
        product: TreeSitterYAMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTOMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterMarkdownRunestone
      - package: TreeSitterLanguages
        product: TreeSitterMarkdownInlineRunestone
      - package: TreeSitterLanguages
        product: TreeSitterBashRunestone
      - package: TreeSitterLanguages
        product: TreeSitterFishRunestone
      - package: TreeSitterLanguages
        product: TreeSitterSQLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterLuaRunestone
      - package: TreeSitterLanguages
        product: TreeSitterDiffRunestone
      - package: TreeSitterLanguages
        product: TreeSitterDartRunestone
      - package: TreeSitterLanguages
        product: TreeSitterScalaRunestone
      - package: TreeSitterLanguages
        product: TreeSitterPerlRunestone
      - package: TreeSitterLanguages
        product: TreeSitterRRunestone
      - package: TreeSitterLanguages
        product: TreeSitterHaskellRunestone
      - package: TreeSitterLanguages
        product: TreeSitterElixirRunestone
      - package: TreeSitterLanguages
        product: TreeSitterProtoRunestone
      - package: TreeSitterLanguages
        product: TreeSitterHCLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterLaTeXRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCMakeRunestone
      - package: TreeSitterLanguages
        product: TreeSitterNixRunestone
      - package: TreeSitterLanguages
        product: TreeSitterOCamlRunestone
      - package: TreeSitterLanguages
        product: TreeSitterElmRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJuliaRunestone
      - package: TreeSitterLanguages
        product: TreeSitterPascalRunestone
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EOF
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hans]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UISupportsDocumentBrowser: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSUserActivityTypes:
          - moe.luoling.eof.open
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: moe.luoling.eof.tab
            UTTypeDescription: EOF Tab
            UTTypeConformsTo: [public.data]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.text
              - public.plain-text
              - public.source-code
              - public.script
              - public.shell-script
              - public.json
              - public.xml
              - public.yaml
              - public.html
              - public.css
              - public.comma-separated-values-text
              - public.log
              - net.daringfireball.markdown
              - com.apple.property-list
          - CFBundleTypeName: Any File
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.content
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: moe.luoling.eof
        PRODUCT_NAME: EOF
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  EOF:
    build:
      targets:
        EOF: all
    run:
      config: Debug
    archive:
      config: Release
